name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'

    - name: Create dummy env file
      run: |
        cd mobile/assets
        echo "API_URL=https://arosaje-backend-t2x7.onrender.com" > .env.mobile

    - name: Install dependencies
      run: |
        cd mobile
        flutter pub get

    - name: Build web
      run: |
        cd mobile
        flutter build web --release --base-href "/Arosaje/"

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: mobile/build/web

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4